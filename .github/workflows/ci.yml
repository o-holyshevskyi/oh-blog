name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GIST_ID: "8e770c205db74ff086cf7b67c6beb3e9"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Project
        run: npm run build
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run E2E Tests & Capture Log
        run: |
          npx playwright test --project=chromium --reporter=list > test-results.log || echo "TEST_FAILED=true" >> $GITHUB_ENV
          gh gist edit $GIST_ID -a test-results.log
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Fail pipeline if tests failed
        if: env.TEST_FAILED == 'true'
        run: exit 1

      - name: Wait for Vercel Deployment
        if: github.event_name == 'push'
        run: |
          echo "Waiting 75 seconds for Vercel to finish deploying the new version..."
          sleep 75

      - name: Run Lighthouse Audit
        run: |
          npx lighthouse https://oholyshevskyi.com --output=json --output-path=report.json --chrome-flags="--headless"

      - name: Parse Metrics & Push to Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          jq '{ perf: (.categories.performance.score * 100 | round), a11y: (.categories.accessibility.score * 100 | round), seo: (.categories.seo.score * 100 | round) }' report.json > metrics.json
          cat metrics.json 
          gh gist edit $GIST_ID metrics.json -a metrics.json